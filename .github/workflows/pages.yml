
# Nombre del workflow
name: "Tests y despliegue en GitHub Pages"

# Cuándo se ejecuta
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Permisos generales
permissions:
  contents: read

# Evita cancelar un despliegue que ya está en marcha
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Primer trabajo: comprobar que todo funciona
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests
        run: npm test

  # Segundo trabajo: publicar la página
  despliegue:
    needs: tests

    # Solo publica desde main y nunca desde un pull request
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6

      - name: Preparar archivos para publicar
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Desplegar página
        id: deployment
        uses: actions/deploy-pages@v5
